services:

  mongodb:
    image: mongo:7
    container_name: kubedeploy-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./app
    container_name: kubedeploy-backend
    restart: unless-stopped

    network_mode: host

    environment:
      MONGO_URI: mongodb://127.0.0.1:27017/kubedeploy
      KUBECONFIG: /root/.kube/config

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/nitesh17/.kube:/root/.kube:ro
      - /home/nitesh17/.minikube:/home/nitesh17/.minikube:ro

    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: kubedeploy-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
